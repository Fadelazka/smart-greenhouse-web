<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Smart IoT Greenhouse">
  <!--
    Ikon maskable: latar penuh tanpa sudut membulat, karena bentuk akhirnya
    ditentukan oleh platform. Isi ikon dijaga tetap di dalam safe zone
    (lingkaran 80% di tengah) supaya tidak terpotong saat di-crop.
  -->
  <rect width="32" height="32" fill="#0F1F1A" />
  <g transform="translate(16 16) scale(1.15) translate(-16 -16)">
    <path d="M16 25V14" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round" />
    <path d="M16 15c0-3.9 2.9-7 7-7 0 3.9-2.9 7-7 7Z" fill="#22C55E" />
    <path d="M16 18c0-3.4-2.6-6-6-6 0 3.4 2.6 6 6 6Z" fill="#15803D" />
  </g>
</svg>
